{% extends 'base_public.html' %}
{% block title %}Login{% endblock %}

{% block extra_head %}
<style>
    .auth-page {
        min-height: calc(100vh - 68px);
        display: flex; align-items: center; justify-content: center;
        padding: 40px 24px;
        background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #d1fae5 100%);
    }
    .auth-card {
        background: #fff; border-radius: 24px;
        box-shadow: 0 20px 60px rgba(6,78,59,.15);
        border: 1px solid rgba(16,185,129,.15);
        overflow: hidden; width: 100%; max-width: 440px;
    }
    .auth-card-header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        padding: 36px 36px 32px; text-align: center; position: relative;
    }
    .auth-card-header::after {
        content: ''; position: absolute;
        bottom: -1px; left: 0; right: 0; height: 24px;
        background: #fff; border-radius: 24px 24px 0 0;
    }
    .auth-logo {
        width: 56px; height: 56px;
        background: rgba(255,255,255,.15); border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 24px; margin: 0 auto 16px;
        border: 2px solid rgba(255,255,255,.25);
    }
    .auth-card-header h2 { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -0.5px; margin-bottom: 6px; }
    .auth-card-header p  { font-size: 14px; color: rgba(255,255,255,.7); }
    .auth-body { padding: 32px 36px 36px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
    .input-wrapper { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 14px; pointer-events: none; }
    .form-input {
        width: 100%; padding: 12px 14px 12px 40px;
        border: 1.5px solid var(--border); border-radius: 10px;
        font-size: 14px; font-family: 'Inter', sans-serif;
        color: var(--text); background: #fafafa;
        transition: var(--transition); outline: none;
    }
    .form-input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(16,185,129,.12); }

    .form-row-inline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .remember-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6b7280; }
    .remember-wrap input[type="checkbox"] { accent-color: var(--accent); }
    .forgot-link { font-size: 13px; font-weight: 600; color: var(--primary-light); text-decoration: none; transition: var(--transition); }
    .forgot-link:hover { color: var(--accent); }

    .btn-auth {
        width: 100%; padding: 14px;
        background: linear-gradient(135deg, var(--primary-light), var(--primary));
        color: #fff; border: none; border-radius: 12px;
        font-size: 16px; font-weight: 700; cursor: pointer;
        transition: var(--transition);
        box-shadow: 0 4px 16px rgba(6,78,59,.25);
        font-family: 'Inter', sans-serif;
    }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,78,59,.3); }

    .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: #6b7280; }
    .auth-footer a { color: var(--primary-light); font-weight: 700; text-decoration: none; }
    .auth-footer a:hover { color: var(--accent); }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-card-header">
            <div class="auth-logo"><i class="fas fa-hospital-user"></i></div>
            <h2>Welcome Back</h2>
            <p>Sign in to manage your medical queue</p>
        </div>
        <div class="auth-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" required class="form-input" placeholder="Enter your username">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" required class="form-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
                    </div>
                </div>
                <div class="form-row-inline">
                    <label class="remember-wrap">
                        <input id="remember-me" name="remember-me" type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <button type="submit" class="btn-auth">Sign In &nbsp;<i class="fas fa-arrow-right"></i></button>
            </form>
            <div class="auth-footer">
                New patient? <a href="{% url 'signup' %}">Create an account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
